<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.6.5 | Spatial Painting</title>

<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: #000; font-family: 'Courier New', Courier, monospace;
}

/* Ottimizzato per ologrammi: Nero assoluto RGB(0,0,0) */
#video, #videoView {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; transform: scaleX(-1);
}
#video { display: none; }
/* Overlay video quasi invisibile per mantenere il focus sul tratto */
#videoView { opacity: 0.05; filter: grayscale(1) brightness(0.4); z-index: 1; pointer-events: none; }

#canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; background: transparent; }

#ui { position: fixed; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 12px; }
button {
  background: rgba(15, 15, 15, 0.9); color: #888; border: 1px solid rgba(255,255,255,0.05);
  padding: 12px 20px; border-radius: 2px; cursor: pointer; font-size: 9px; letter-spacing: 3px; 
  text-transform: uppercase; transition: all 0.3s ease;
}
button:hover { color: #fff; border-color: #fff; background: #000; }

#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999;
  background: #000; color: white; text-align: center;
}
#startApp {
  margin-top: 40px; padding: 15px 35px; border: 1px solid #444;
  background: transparent; color: #fff; cursor: pointer; border-radius: 0; letter-spacing: 5px;
}
#startApp:hover { border-color: #fff; letter-spacing: 7px; }
</style>
</head>
<body>

<div id="splash">
  <h1 style="letter-spacing: 20px; font-weight: 100; margin-bottom: 5px;">ENTROPIA CINETICA</h1>
  <p style="opacity: 0.3; font-size: 10px; letter-spacing: 2px;">WEB-AR INSTALLATION • V1.6.5</p>
  <button id="startApp">INITIALIZE</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">Void</button>
  <button id="saveBtn">Export Canvas</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();

// Punti chiave ottimizzati per l'estetica del corpo nello spazio
const LANDMARK_INDEXES = [0, 11, 12, 13, 14, 15, 16, 23, 24];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 1280, height: 720 }, audio: false
  });
  video.srcObject = stream;
  document.getElementById('videoView').srcObject = stream;
  return new Promise(r => video.onloadedmetadata = () => { video.play(); r(); });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task' },
    runningMode: 'VIDEO', numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160; sampleCanvas.height = 90;

function getColor(x, y) {
  if (!video.videoWidth) return { r:255, g:255, b:255 };
  const sx = Math.floor((1 - x) * sampleCanvas.width);
  const sy = Math.floor(y * sampleCanvas.height);
  const d = sampleCtx.getImageData(sx, sy, 1, 1).data;
  return { r: d[0], g: d[1], b: d[2] };
}

/* --- BRUSH SPATIAL BRISTLE V1.6.5 --- */
function drawSpatialBristle(prev, curr, color, zDepth, speed) {
  ctx.save();
  
  // Calcolo spessore con taglio 70% per AR: la linea rimane sottile ed elegante
  const baseWeight = Math.max(0.15, (zDepth * -4.2) + 0.55);
  
  // Numero fisso di 5 setole per un effetto "minimalista/materico"
  const bristleCount = 5; 
  const spread = baseWeight * 2.8;

  const midX = (prev.x + curr.x) / 2;
  const midY = (prev.y + curr.y) / 2;

  for (let i = 0; i < bristleCount; i++) {
    // Offset basato sulla velocità: più corri, più le setole si "sfilacciano"
    const speedVariation = speed / 50;
    const offsetX = (Math.random() - 0.5) * (spread + speedVariation);
    const offsetY = (Math.random() - 0.5) * (spread + speedVariation);

    ctx.beginPath();
    ctx.moveTo(prev.x + offsetX, prev.y + offsetY);
    ctx.quadraticCurveTo(midX + offsetX, midY + offsetY, curr.x + offsetX, curr.y + offsetY);
    
    // Alpha dinamico: simula la pressione del pennello
    const alphaBase = Math.min(0.6, speed / 25);
    ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alphaBase * (0.4 + Math.random() * 0.6)})`;
    ctx.lineWidth = baseWeight * (0.5 + Math.random() * 0.5);
    ctx.lineCap = 'butt'; // Taglio netto della setola per un look più "analogico"
    ctx.stroke();
  }
  
  ctx.restore();
}

function detect() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
    const results = poseLandmarker.detectForVideo(video, performance.now());
    
    if (results.landmarks?.length) {
      const landmarks = results.landmarks[0];
      LANDMARK_INDEXES.forEach(index => {
        const lm = landmarks[index];
        if (!lm || lm.visibility < 0.75) return;

        const x = (1 - lm.x) * window.innerWidth;
        const y = lm.y * window.innerHeight;
        const prev = previousPoints.get(index);

        if (prev) {
          const speed = Math.hypot(x - prev.x, y - prev.y);
          // Soglia 3.5: eliminiamo ogni micro-tremolio per un segno puro
          if (speed > 3.5) { 
            const color = getColor(lm.x, lm.y);
            drawSpatialBristle(prev, {x, y}, color, lm.z, speed);
          }
        }
        previousPoints.set(index, {x, y});
      });
    }
  }
  requestAnimationFrame(detect);
}

document.getElementById('resetBtn').onclick = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    previousPoints.clear();
};

document.getElementById('saveBtn').onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#000'; octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(canvas, 0,0);
  const link = document.createElement('a');
  link.download = 'spatial-painting-v1-6-5.png';
  link.href = out.toDataURL(); link.click();
};

document.getElementById('startApp').onclick = async () => {
  document.getElementById('splash').style.display = 'none';
  await setupCamera();
  await setupPose();
  detect();
};
</script>
</body>
</html>
