# Entropia Cinetica v1.5.0

Versione evoluta con scie più lunghe, pennellate organiche e resa pittorica astratta.

```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.5.0</title>

<style>

</head>
<body>

<div id="splash">
  <h1>ENTROPIA CINETICA</h1>
  <p>web app v1.5.0</p>
  <button id="startApp">Avvia web app</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">Reset</button>
  <button id="saveBtn">Salva PNG</button>
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const videoView = document.getElementById('videoView');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let lastStrokeTime = new Map();
let particles = [];

const LANDMARK_INDEXES = [0,11,12,13,14,15,16,23,24,25,26,27,28];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: 'user',
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });

  video.srcObject = stream;
  videoView.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = async () => {
      await video.play();
      resolve();
    };
  });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
    },
    runningMode: 'VIDEO',
    numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 200;
sampleCanvas.height = 112;

function getColorFromVideo(x, y) {
  if (!video.videoWidth || !video.videoHeight) {
    return 'rgba(255,255,255,0.35)';
  }

  const sx = Math.floor((1 - x) * sampleCanvas.width);
  const sy = Math.floor(y * sampleCanvas.height);
  const radius = 4;

  let totalR = 0, totalG = 0, totalB = 0, count = 0;

  for (let yy = -radius; yy <= radius; yy++) {
    for (let xx = -radius; xx <= radius; xx++) {
      const px = Math.max(0, Math.min(sampleCanvas.width - 1, sx + xx));
      const py = Math.max(0, Math.min(sampleCanvas.height - 1, sy + yy));
      const data = sampleCtx.getImageData(px, py, 1, 1).data;
      totalR += data[0];
      totalG += data[1];
      totalB += data[2];
      count++;
    }
  }

  let r = totalR / count;
  let g = totalG / count;
  let b = totalB / count;

  const avg = (r + g + b) / 3;
  r = avg + (r - avg) * 2.0;
  g = avg + (g - avg) * 2.0;
  b = avg + (b - avg) * 2.0;

  r *= 1.4;
  g *= 1.4;
  b *= 1.4;

  r = Math.max(0, Math.min(255, Math.round(r)));
  g = Math.max(0, Math.min(255, Math.round(g)));
  b = Math.max(0, Math.min(255, Math.round(b)));

  return `rgba(${r}, ${g}, ${b}, 0.55)`;
}

function drawBrushStroke(prev, curr, color, speed, depth) {
  const dx = curr.x - prev.x;
  const dy = curr.y - prev.y;
  const distance = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);

  const width = Math.max(2, Math.min(28, speed * 0.08 + depth * 10));
  const alpha = Math.max(0.18, Math.min(0.85, 0.25 + depth * 0.35));

  const tailLength = Math.max(20, Math.min(140, distance * 2.2));

  const tailX = prev.x - Math.cos(angle) * tailLength;
  const tailY = prev.y - Math.sin(angle) * tailLength;

  const cx1 = prev.x + dx * 0.25 + (Math.random() - 0.5) * 20;
  const cy1 = prev.y + dy * 0.25 + (Math.random() - 0.5) * 20;
  const cx2 = prev.x + dx * 0.75 + (Math.random() - 0.5) * 20;
  const cy2 = prev.y + dy * 0.75 + (Math.random() - 0.5) * 20;

  // Alone morbido.
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = width * 2.2;
  ctx.globalAlpha = alpha * 0.08;
  ctx.filter = 'blur(10px)';
  ctx.beginPath();
  ctx.moveTo(tailX, tailY);
  ctx.bezierCurveTo(cx1, cy1, cx2, cy2, curr.x, curr.y);
  ctx.stroke();
  ctx.restore();

  // Corpo principale della pennellata.
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = width;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(tailX, tailY);
  ctx.bezierCurveTo(cx1, cy1, cx2, cy2, curr.x, curr.y);
  ctx.stroke();
  ctx.restore();

  // Setole secondarie per effetto pittorico.
  for (let i = 0; i < 3; i++) {
    const offset = (Math.random() - 0.5) * width * 0.6;
    const nx = Math.cos(angle + Math.PI / 2) * offset;
    const ny = Math.sin(angle + Math.PI / 2) * offset;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = width * (0.18 + Math.random() * 0.12);
    ctx.globalAlpha = alpha * 0.35;
    ctx.beginPath();
    ctx.moveTo(tailX + nx, tailY + ny);
    ctx.bezierCurveTo(
      cx1 + nx,
      cy1 + ny,
      cx2 + nx,
      cy2 + ny,
      curr.x + nx,
      curr.y + ny
    );
    ctx.stroke();
    ctx.restore();
  }
}

function drawTrails(landmarks) {
  const now = performance.now();

  for (const index of LANDMARK_INDEXES) {
    const lm = landmarks[index];
    if (!lm || lm.visibility < 0.6) continue;

    const x = (1 - lm.x) * window.innerWidth;
    const y = lm.y * window.innerHeight;
    const z = lm.z || 0;

    const prev = previousPoints.get(index);
    const color = getColorFromVideo(lm.x, lm.y);

    if (prev) {
      const dx = x - prev.x;
      const dy = y - prev.y;
      const speed = Math.hypot(dx, dy);

      if (speed > 2) {
        const last = lastStrokeTime.get(index) || 0;
        if (now - last > 20) {
          lastStrokeTime.set(index, now);
          const depth = Math.max(0, Math.min(1, 1 - Math.abs(z) * 2));
          drawBrushStroke(prev, { x, y }, color, speed, depth);
        }
      }
    }

    previousPoints.set(index, { x, y, z });
  }
}

function render() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  }
  requestAnimationFrame(render);
}

function detectLoop() {
  const results = poseLandmarker.detectForVideo(video, performance.now());

  if (results.landmarks?.length) {
    drawTrails(results.landmarks[0]);
  }

  requestAnimationFrame(detectLoop);
}

function resetCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  previousPoints.clear();
  lastStrokeTime.clear();
  particles = [];
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.globalCompositeOperation = 'source-over';
}

function saveCanvas() {
  const exportCanvas = document.createElement('canvas');
  const exportCtx = exportCanvas.getContext('2d');

  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;

  exportCtx.fillStyle = '#000';
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  exportCtx.drawImage(canvas, 0, 0);

  const link = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.download = `entropia-cinetica-${timestamp}.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
}

async function goFullscreen() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen().catch(() => {});
  }
}

document.getElementById('resetBtn').addEventListener('click', resetCanvas);
document.getElementById('saveBtn').addEventListener('click', saveCanvas);
document.getElementById('fullscreenBtn').addEventListener('click', goFullscreen);

document.getElementById('startApp').addEventListener('click', async () => {
  document.getElementById('splash').style.display = 'none';

  resetCanvas();
  await setupCamera();
  await setupPose();

  render();
  detectLoop();

  setInterval(resetCanvas, 180000);
});
</script>

</body>
</html>
```
