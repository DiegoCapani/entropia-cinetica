<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.5.1</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

#video { display:none; }

#videoView {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0.18;
}

#canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let prevPoints = new Map();
let lastStroke = new Map();

/* ---------------- CANVAS ---------------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- CAMERA ---------------- */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user' }
  });

  video.srcObject = stream;

  return new Promise(r => {
    video.onloadedmetadata = async () => {
      await video.play();
      r();
    };
  });
}

/* ---------------- POSE ---------------- */
async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
    },
    runningMode: 'VIDEO'
  });
}

/* ---------------- COLOR SAMPLING REAL ---------------- */
const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160;
sampleCanvas.height = 90;

/* IMPORTANT: feed real webcam frame (no flip) */
function updateSample() {
  if (video.videoWidth) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  }
}

/* real color from camera pixels */
function getColor(x, y) {
  const px = Math.floor(x * sampleCanvas.width);
  const py = Math.floor(y * sampleCanvas.height);

  const data = sampleCtx.getImageData(px, py, 1, 1).data;

  return `rgba(${data[0]},${data[1]},${data[2]},0.6)`;
}

/* ---------------- BRUSH ---------------- */
function draw(prev, curr, color, speed) {

  const dx = curr.x - prev.x;
  const dy = curr.y - prev.y;
  const dist = Math.hypot(dx, dy);

  const width = Math.min(26, 2 + speed * 0.06);

  const cx1 = prev.x + dx * 0.3;
  const cy1 = prev.y + dy * 0.3;
  const cx2 = prev.x + dx * 0.7;
  const cy2 = prev.y + dy * 0.7;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(prev.x, prev.y);
  ctx.bezierCurveTo(cx1,cy1,cx2,cy2,curr.x,curr.y);
  ctx.stroke();

  ctx.restore();
}

/* ---------------- TRAILS ---------------- */
function loopPose(results) {
  const now = performance.now();

  if (!results.landmarks?.length) return;

  const lm = results.landmarks[0];

  for (let i=0;i<lm.length;i++) {

    const p = lm[i];
    if (!p || p.visibility < 0.7) continue;

    const x = p.x * innerWidth;
    const y = p.y * innerHeight;

    const prev = prevPoints.get(i);

    if (prev) {

      const dx = x - prev.x;
      const dy = y - prev.y;
      const speed = Math.hypot(dx, dy);

      /* 🚨 HARD STOP: niente movimento = niente scia */
      if (speed < 3.8) continue;

      const last = lastStroke.get(i) || 0;
      if (now - last < 25) continue;

      const color = getColor(p.x, p.y);

      draw(prev, {x,y}, color, speed);

      lastStroke.set(i, now);
    }

    prevPoints.set(i, {x,y});
  }
}

/* ---------------- LOOPS ---------------- */
function render() {
  updateSample();
  requestAnimationFrame(render);
}

function detect() {
  const res = poseLandmarker.detectForVideo(video, performance.now());
  loopPose(res);
  requestAnimationFrame(detect);
}

/* ---------------- START ---------------- */
async function start() {
  await setupCamera();
  await setupPose();

  render();
  detect();
}

start();

</script>

</body>
</html>
