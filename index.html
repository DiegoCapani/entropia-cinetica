<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.6.2</title>

<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: #000; font-family: 'Courier New', Courier, monospace;
}

#video, #videoView {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; transform: scaleX(-1);
}
#video { display: none; }
#videoView { opacity: 0.1; filter: grayscale(1) contrast(1.2); z-index: 1; pointer-events: none; }

#canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; background: transparent; }

#ui { position: fixed; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; }
button {
  background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 11px; letter-spacing: 1px;
}
button:hover { background: #fff; color: #000; }

#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999;
  background: #000; color: white; text-align: center;
}
#startApp {
  margin-top: 30px; padding: 12px 24px; border: 1px solid white;
  background: transparent; color: white; cursor: pointer; border-radius: 4px;
}
</style>
</head>
<body>

<div id="splash">
  <h1 style="letter-spacing: 7px; font-weight: 200;">ENTROPIA CINETICA</h1>
  <p style="opacity: 0.4;">V1.6.2 • BI-CHROMATIC DEPTH</p>
  <button id="startApp">ATTIVA INSTALLAZIONE</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">RESET</button>
  <button id="saveBtn">EXPORT PNG</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let dominantColors = [{r:255,g:255,b:255}, {r:100,g:100,b:100}];

const LANDMARK_INDEXES = [0, 11, 12, 13, 14, 15, 16, 23, 24];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 1280, height: 720 }, audio: false
  });
  video.srcObject = stream;
  document.getElementById('videoView').srcObject = stream;
  return new Promise(r => video.onloadedmetadata = () => { video.play(); r(); });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task' },
    runningMode: 'VIDEO', numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160; sampleCanvas.height = 90;

// Ottimizzazione Hardware: Aggiorna i 2 colori dominanti ogni 60 frame
function updateDominantColors() {
  if (!video.videoWidth) return;
  sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  const data = sampleCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;
  
  let bright = {r:0, g:0, b:0, lum:0};
  let dark = {r:255, g:255, b:255, lum:255};

  for (let i = 0; i < data.length; i += 400) { // Salto campioni per velocità
    const r = data[i], g = data[i+1], b = data[i+2];
    const lum = 0.2126*r + 0.7152*g + 0.0722*b;
    if (lum > bright.lum) bright = {r, g, b, lum};
    if (lum < dark.lum) dark = {r, g, b, lum};
  }
  dominantColors = [bright, dark];
}

function drawContinuousLiquidStroke(prev, curr, colorIndex, zDepth) {
  ctx.save();
  
  // 1. Spessore Ultra-Fine (Ridotto ulteriormente del 50%)
  // Range: ~0.3px (lontano) a ~4px (vicinissimo)
  const baseWeight = Math.max(0.2, (zDepth * -3.75) + 0.6); 
  
  const midX = (prev.x + curr.x) / 2;
  const midY = (prev.y + curr.y) / 2;
  const color = dominantColors[colorIndex];

  ctx.beginPath();
  ctx.moveTo(prev.x, prev.y);
  ctx.quadraticCurveTo(midX, midY, curr.x, curr.y);
  
  ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.5)`;
  ctx.lineWidth = baseWeight;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

let frameCount = 0;
function detect() {
  if (video.readyState >= 2) {
    if (frameCount % 60 === 0) updateDominantColors();
    frameCount++;

    const results = poseLandmarker.detectForVideo(video, performance.now());
    
    if (results.landmarks?.length) {
      const landmarks = results.landmarks[0];
      LANDMARK_INDEXES.forEach((index, i) => {
        const lm = landmarks[index];
        if (!lm || lm.visibility < 0.7) return;

        const x = (1 - lm.x) * window.innerWidth;
        const y = lm.y * window.innerHeight;
        const prev = previousPoints.get(index);

        if (prev) {
          const dist = Math.hypot(x - prev.x, y - prev.y);
          // 2. Soglia di movimento migliorata: nessuna scia se non c'è spostamento reale
          if (dist > 3.5) { 
            // Alterna i due colori dominanti tra i diversi arti per contrasto
            const colorIdx = i % 2;
            drawContinuousLiquidStroke(prev, {x, y}, colorIdx, lm.z);
          }
        }
        previousPoints.set(index, {x, y});
      });
    }
  }
  requestAnimationFrame(detect);
}

document.getElementById('resetBtn').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById('saveBtn').onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#000'; octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(canvas, 0,0);
  const link = document.createElement('a');
  link.download = 'entropia-v1-6-2.png';
  link.href = out.toDataURL(); link.click();
};

document.getElementById('startApp').onclick = async () => {
  document.getElementById('splash').style.display = 'none';
  await setupCamera();
  await setupPose();
  detect();
};
</script>
</body>
</html>
