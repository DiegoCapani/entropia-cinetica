<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.5.0</title>

<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: #000; font-family: 'Courier New', Courier, monospace;
}

#video, #videoView {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; transform: scaleX(-1);
}
#video { display: none; }
#videoView { opacity: 0.12; filter: grayscale(1) contrast(1.2); z-index: 1; pointer-events: none; }

#canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; background: transparent; }

#ui { position: fixed; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; }
button {
  background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; letter-spacing: 1px;
}
button:hover { background: #fff; color: #000; }

#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999;
  background: #000; color: white; text-align: center;
}
#startApp {
  margin-top: 30px; padding: 12px 24px; border: 1px solid white;
  background: transparent; color: white; cursor: pointer;
}
</style>
</head>
<body>

<div id="splash">
  <h1 style="letter-spacing: 5px;">ENTROPIA CINETICA</h1>
  <p style="opacity: 0.5;">STUDIO SUL MOVIMENTO V1.5.0</p>
  <button id="startApp">INIZIA SCAN</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">RESET</button>
  <button id="saveBtn">EXPORT PNG</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let lastStrokeTime = new Map();

const LANDMARK_INDEXES = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 1280, height: 720 }, audio: false
  });
  video.srcObject = stream;
  document.getElementById('videoView').srcObject = stream;
  return new Promise(r => video.onloadedmetadata = () => { video.play(); r(); });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task' },
    runningMode: 'VIDEO', numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160; sampleCanvas.height = 90;

function getColor(x, y) {
  if (!video.videoWidth) return { r:255, g:255, b:255 };
  // Campionamento specchiato per coincidere con la vista utente
  const sx = Math.floor((1 - x) * sampleCanvas.width);
  const sy = Math.floor(y * sampleCanvas.height);
  const d = sampleCtx.getImageData(sx, sy, 1, 1).data;
  return { r: d[0], g: d[1], b: d[2] };
}

/* --- IL PENNELLO ARTISTICO V1.5 --- */
function drawArtisticStroke(prev, curr, color, speed) {
  const dx = curr.x - prev.x;
  const dy = curr.y - prev.y;
  const angle = Math.atan2(dy, dx);
  
  // Numero di setole basato sulla velocità
  const strands = Math.floor(Math.min(8, 3 + speed * 0.1));
  const spread = Math.min(20, 5 + speed * 0.2);
  
  ctx.save();
  
  for (let i = 0; i < strands; i++) {
    // Offset casuale per simulare le setole di un pennello
    const offset = (i - strands / 2) * (spread / strands);
    const ox = Math.sin(angle) * offset;
    const oy = Math.cos(angle) * offset;
    
    const alpha = Math.max(0.1, 0.4 - (i * 0.02));
    ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
    ctx.lineWidth = Math.max(0.5, speed * 0.02);
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(prev.x + ox, prev.y + oy);
    // Un pizzico di curvatura casuale per la fluidità
    const cx = (prev.x + curr.x) / 2 + (Math.random() - 0.5) * 10;
    const cy = (prev.y + curr.y) / 2 + (Math.random() - 0.5) * 10;
    ctx.quadraticCurveTo(cx + ox, cy + oy, curr.x + ox, curr.y + oy);
    ctx.stroke();
  }
  
  // Aggiunta di "schizzi" per movimenti molto veloci
  if (speed > 40) {
    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.3)`;
    for(let j=0; j<3; j++) {
      ctx.beginPath();
      ctx.arc(curr.x + (Math.random()-0.5)*40, curr.y + (Math.random()-0.5)*40, Math.random()*2, 0, Math.PI*2);
      ctx.fill();
    }
  }
  
  ctx.restore();
}

function detect() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
    const results = poseLandmarker.detectForVideo(video, performance.now());
    
    if (results.landmarks?.length) {
      const landmarks = results.landmarks[0];
      LANDMARK_INDEXES.forEach(index => {
        const lm = landmarks[index];
        if (!lm || lm.visibility < 0.7) return;

        const x = (1 - lm.x) * window.innerWidth;
        const y = lm.y * window.innerHeight;
        const prev = previousPoints.get(index);

        if (prev) {
          const speed = Math.hypot(x - prev.x, y - prev.y);
          // 🚨 FILTRO MOVIMENTO: Disegna solo se c'è spostamento reale
          if (speed > 5) {
            const color = getColor(lm.x, lm.y);
            drawArtisticStroke(prev, {x, y}, color, speed);
          }
        }
        previousPoints.set(index, {x, y});
      });
    }
  }
  requestAnimationFrame(detect);
}

document.getElementById('resetBtn').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById('saveBtn').onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#000'; octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(canvas, 0,0);
  const link = document.createElement('a');
  link.download = 'entropia-v1-5.png';
  link.href = out.toDataURL(); link.click();
};

document.getElementById('startApp').onclick = async () => {
  document.getElementById('splash').style.display = 'none';
  await setupCamera();
  await setupPose();
  detect();
  setInterval(() => ctx.clearRect(0,0,canvas.width,canvas.height), 180000);
};
</script>
</body>
</html>
