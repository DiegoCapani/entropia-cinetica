<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica V0.2</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

#video { display:none; }

#videoView {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0.15; /* Sfondo quasi impercettibile per far risaltare la tela collettiva */
}

#canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let prevPoints = new Map();
let lastStroke = new Map();

/* ---------------- CANVAS SETUP ---------------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- CAMERA ---------------- */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user' }
  });
  video.srcObject = stream;
  const view = document.getElementById('videoView');
  view.srcObject = stream;

  return new Promise(r => {
    video.onloadedmetadata = async () => {
      await video.play();
      r();
    };
  });
}

/* ---------------- POSE ESTIMATION ---------------- */
async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
    },
    runningMode: 'VIDEO',
    numPoses: 2 // Permette a più persone di contribuire alla tela
  });
}

/* ---------------- SAMPLING ENGINE ---------------- */
const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160;
sampleCanvas.height = 90;

function updateSample() {
  if (video.videoWidth) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  }
}

function getColor(x, y, alpha = 0.5) {
  const px = Math.floor(x * sampleCanvas.width);
  const py = Math.floor(y * sampleCanvas.height);
  const data = sampleCtx.getImageData(px, py, 1, 1).data;
  return {
    r: data[0],
    g: data[1],
    b: data[2],
    rgba: `rgba(${data[0]},${data[1]},${data[2]},${alpha})`
  };
}

/* ---------------- ARTISTIC BRUSH ENGINE V0.2 ---------------- */
function drawArtisticStroke(prev, curr, colorObj, speed) {
  const dx = curr.x - prev.x;
  const dy = curr.y - prev.y;
  
  // Spessore variabile in base alla velocità
  const baseWidth = Math.min(35, 3 + speed * 0.08);
  
  ctx.save();
  
  // 1. Traccia principale (Nucleo)
  ctx.beginPath();
  ctx.strokeStyle = colorObj.rgba;
  ctx.lineWidth = baseWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.moveTo(prev.x, prev.y);
  ctx.quadraticCurveTo(prev.x + dx/2, prev.y + dy/2, curr.x, curr.y);
  ctx.stroke();

  // 2. Effetto "Setole" (Dettaglio pittorico)
  // Crea piccole scie parallele per simulare un pennello fisico
  const strands = 3;
  for (let i = 0; i < strands; i++) {
    const offset = (i - strands/2) * (baseWidth * 0.4);
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${colorObj.r}, ${colorObj.g}, ${colorObj.b}, 0.3)`;
    ctx.lineWidth = baseWidth * 0.2;
    ctx.moveTo(prev.x + offset, prev.y + offset);
    ctx.lineTo(curr.x + offset, curr.y + offset);
    ctx.stroke();
  }

  // 3. Particelle di dispersione (Entropia)
  if (speed > 10) {
    ctx.fillStyle = colorObj.rgba;
    for (let i = 0; i < 2; i++) {
        const px = curr.x + (Math.random() - 0.5) * 20;
        const py = curr.y + (Math.random() - 0.5) * 20;
        ctx.beginPath();
        ctx.arc(px, py, Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
    }
  }

  ctx.restore();
}

/* ---------------- PROCESSING LOOP ---------------- */
function loopPose(results) {
  const now = performance.now();
  if (!results.landmarks?.length) return;

  results.landmarks.forEach((lm) => {
    for (let i = 0; i < lm.length; i++) {
      const p = lm[i];
      if (!p || p.visibility < 0.7) continue;

      // Inversione X per mirror effect
      const x = (1 - p.x) * innerWidth; 
      const y = p.y * innerHeight;

      const prev = prevPoints.get(i);

      if (prev) {
        const speed = Math.hypot(x - prev.x, y - prev.y);

        if (speed < 4.5) continue; // Filtro rumore

        const last = lastStroke.get(i) || 0;
        if (now - last < 16) continue; // ~60fps drawing

        const colorObj = getColor(p.x, p.y, 0.4);
        drawArtisticStroke(prev, {x, y}, colorObj, speed);

        lastStroke.set(i, now);
      }
      prevPoints.set(i, {x, y});
    }
  });
}

function render() {
  updateSample();
  requestAnimationFrame(render);
}

function detect() {
  if (poseLandmarker && video.readyState >= 2) {
    const res = poseLandmarker.detectForVideo(video, performance.now());
    loopPose(res);
  }
  requestAnimationFrame(detect);
}

/* ---------------- BOOT ---------------- */
async function start() {
  try {
    await setupCamera();
    await setupPose();
    render();
    detect();
  } catch (err) {
    console.error("Errore inizializzazione:", err);
  }
}

start();

</script>
</body>
</html>
