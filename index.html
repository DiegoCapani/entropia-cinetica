# Entropia Cinetica v1.4

```html
<!DOCTYPE html>
<html lang="it">
<head>

<style>

<body>

<div id="splash">
  <h1>ENTROPIA CINETICA</h1>
  <p>web app v1.4</p>
  <button id="startApp">Avvia web app</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">Reset</button>
  <button id="saveBtn">Salva PNG</button>
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const videoView = document.getElementById('videoView');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let particles = [];
let lastStrokeTime = new Map();

const LANDMARK_INDEXES = [
  0, 11, 12,
  13, 14,
  15, 16,
  23, 24,
  25, 26,
  27, 28
];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user' },
    audio: false
  });

  video.srcObject = stream;
  videoView.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
    },
    runningMode: 'VIDEO',
    numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160;
sampleCanvas.height = 90;

function clamp(v, min = 0, max = 255) {
  return Math.max(min, Math.min(max, v));
}

function getColorFromVideo(x, y) {
  if (!video.videoWidth || !video.videoHeight) {
    return 'rgba(255,255,255,0.25)';
  }

  const sx = Math.floor((1 - x) * sampleCanvas.width);
  const sy = Math.floor(y * sampleCanvas.height);

  const radius = 2;
  const startX = Math.max(0, sx - radius);
  const startY = Math.max(0, sy - radius);
  const width = Math.min(sampleCanvas.width - startX, radius * 2 + 1);
  const height = Math.min(sampleCanvas.height - startY, radius * 2 + 1);

  const data = sampleCtx.getImageData(startX, startY, width, height).data;

  let r = 0, g = 0, b = 0;
  const count = data.length / 4;

  for (let i = 0; i < data.length; i += 4) {
    r += data[i];
    g += data[i + 1];
    b += data[i + 2];
  }

  r /= count;
  g /= count;
  b /= count;

  const avg = (r + g + b) / 3;

  r = r + (r - avg) * 0.8;
  g = g + (g - avg) * 0.8;
  b = b + (b - avg) * 0.8;

  r *= 1.20;
  g *= 1.20;
  b *= 1.20;

  r = clamp(r);
  g = clamp(g);
  b = clamp(b);

  return `rgba(${r}, ${g}, ${b}, 0.22)`;
}

function drawTrails(landmarks) {
  const now = performance.now();

  for (const index of LANDMARK_INDEXES) {
    const lm = landmarks[index];
    if (!lm || lm.visibility < 0.6) continue;

    const x = (1 - lm.x) * window.innerWidth;
    const y = lm.y * window.innerHeight;
    const z = lm.z || 0;

    const prev = previousPoints.get(index);
    const color = getColorFromVideo(lm.x, lm.y);

    if (prev) {
      const dx = x - prev.x;
      const dy = y - prev.y;
      const speed = Math.hypot(dx, dy);

      if (speed < 5) {
        previousPoints.set(index, { x, y, z });
        continue;
      }

      const last = lastStrokeTime.get(index) || 0;
      if (now - last < 40) {
        previousPoints.set(index, { x, y, z });
        continue;
      }
      lastStrokeTime.set(index, now);

      const depth = Math.max(0, Math.min(1, 1 - Math.abs(z) * 2));
      const baseWidth = Math.max(1.5, Math.min(26, speed * 0.06 + depth * 12));
      const baseAlpha = Math.max(0.04, Math.min(0.30, 0.05 + depth * 0.25));
      const jitter = 3 + depth * 6;

      const cx = (prev.x + x) / 2 + (Math.random() - 0.5) * jitter;
      const cy = (prev.y + y) / 2 + (Math.random() - 0.5) * jitter;

      // Glow esterno
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = baseWidth * 2.6;
      ctx.globalAlpha = baseAlpha * 0.15;
      ctx.filter = 'blur(8px)';
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.quadraticCurveTo(cx, cy, x, y);
      ctx.stroke();
      ctx.restore();

      // Corpo principale
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = baseWidth;
      ctx.globalAlpha = baseAlpha;
      ctx.filter = 'blur(1px)';
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.quadraticCurveTo(cx, cy, x, y);
      ctx.stroke();
      ctx.restore();

      // Highlight interno
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = baseWidth * 0.18;
      ctx.globalAlpha = baseAlpha * 0.35;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.quadraticCurveTo(cx, cy, x, y);
      ctx.stroke();
      ctx.restore();

      // Filamento secondario
      if (speed > 20) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = baseWidth * 0.35;
        ctx.globalAlpha = baseAlpha * 0.35;

        const offset = (Math.random() - 0.5) * 10;

        ctx.beginPath();
        ctx.moveTo(prev.x + offset, prev.y - offset);
        ctx.quadraticCurveTo(
          cx + offset,
          cy - offset,
          x + offset,
          y - offset
        );
        ctx.stroke();
        ctx.restore();
      }

      // Nodo luminoso
      if (speed > 12) {
        ctx.save();
        const radius = baseWidth * 0.4;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
        grad.addColorStop(0, 'rgba(255,255,255,0.35)');
        grad.addColorStop(0.3, color.replace(/0\.22\)/, '0.18)'));
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    previousPoints.set(index, { x, y, z });
  }
}

function render() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  }
  requestAnimationFrame(render);
}

async function detectLoop() {
  const results = poseLandmarker.detectForVideo(video, performance.now());

  if (results.landmarks && results.landmarks.length > 0) {
    drawTrails(results.landmarks[0]);
  }

  requestAnimationFrame(detectLoop);
}

function resetCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = [];
  previousPoints.clear();
}

function saveCanvas() {
  const exportCanvas = document.createElement('canvas');
  const exportCtx = exportCanvas.getContext('2d');

  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;

  exportCtx.fillStyle = '#000';
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  exportCtx.drawImage(canvas, 0, 0);

  const link = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.download = `entropia-cinetica-${timestamp}.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
}

async function goFullscreen() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen().catch(() => {});
  }
}

document.getElementById('resetBtn').addEventListener('click', resetCanvas);
document.getElementById('saveBtn').addEventListener('click', saveCanvas);
document.getElementById('fullscreenBtn').addEventListener('click', goFullscreen);

document.getElementById('startApp').addEventListener('click', async () => {
  document.getElementById('splash').style.display = 'none';

  resetCanvas();
  await setupCamera();
  await setupPose();

  render();
  detectLoop();

  // Reset automatico ogni 3 minuti
  setInterval(resetCanvas, 180000);
});
</script>

</body>
</html>
