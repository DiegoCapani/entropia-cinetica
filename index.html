<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica v1.5.1</title>

<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: #000; font-family: 'Courier New', Courier, monospace;
}

#video, #videoView {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; transform: scaleX(-1);
}
#video { display: none; }
#videoView { opacity: 0.14; filter: contrast(1.1) brightness(0.8); z-index: 1; pointer-events: none; }

#canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; background: transparent; }

#ui { position: fixed; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; }
button {
  background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 18px; border-radius: 30px; cursor: pointer; font-size: 11px; letter-spacing: 1.5px;
  transition: all 0.3s;
}
button:hover { background: #fff; color: #000; border-color: #fff; }

#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999;
  background: #000; color: white; text-align: center;
}
#startApp {
  margin-top: 30px; padding: 12px 30px; border: 1px solid white;
  background: transparent; color: white; cursor: pointer; border-radius: 50px;
}
</style>
</head>
<body>

<div id="splash">
  <h1 style="letter-spacing: 8px; font-weight: 300;">ENTROPIA CINETICA</h1>
  <p style="opacity: 0.4;">V1.5.1 • LIQUID TRACE</p>
  <button id="startApp">ATTIVA CAMERA</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">RESET TELA</button>
  <button id="saveBtn">EXPORT PNG</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let lastStrokeTime = new Map();

// Punti focali per un'estetica pulita: testa, mani, gomiti, spalle
const LANDMARK_INDEXES = [0, 11, 12, 13, 14, 15, 16, 23, 24];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 1280, height: 720 }, audio: false
  });
  video.srcObject = stream;
  document.getElementById('videoView').srcObject = stream;
  return new Promise(r => video.onloadedmetadata = () => { video.play(); r(); });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task' },
    runningMode: 'VIDEO', numPoses: 1
  });
}

const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = 160; sampleCanvas.height = 90;

function getColor(x, y) {
  if (!video.videoWidth) return { r:255, g:255, b:255 };
  const sx = Math.floor((1 - x) * sampleCanvas.width);
  const sy = Math.floor(y * sampleCanvas.height);
  const d = sampleCtx.getImageData(sx, sy, 1, 1).data;
  return { r: d[0], g: d[1], b: d[2] };
}

/* --- BRUSH LIQUIDO V1.5.1 --- */
function drawSinuousStroke(prev, curr, color, speed) {
  ctx.save();
  
  // Lo spessore è inversamente proporzionale alla velocità per un effetto "piuma"
  // Più veloce = più sottile e sinuoso
  const weight = Math.max(1, Math.min(12, 20 / (speed * 0.1 + 1) + 2));
  const alpha = Math.max(0.1, Math.min(0.6, 0.8 / (speed * 0.05 + 1)));

  ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
  ctx.lineWidth = weight;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Punto di controllo per la curva dolce (punto medio con offset armonico)
  const midX = (prev.x + curr.x) / 2;
  const midY = (prev.y + curr.y) / 2;

  ctx.beginPath();
  ctx.moveTo(prev.x, prev.y);
  // La curva quadratica crea la morbidezza che hai chiesto
  ctx.quadraticCurveTo(midX, midY, curr.x, curr.y);
  ctx.stroke();

  // Opzionale: un leggero bagliore per dare profondità alla linea calligrafica
  ctx.globalAlpha = alpha * 0.3;
  ctx.lineWidth = weight * 2.5;
  ctx.filter = 'blur(4px)';
  ctx.stroke();

  ctx.restore();
}

function detect() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
    const results = poseLandmarker.detectForVideo(video, performance.now());
    
    if (results.landmarks?.length) {
      const landmarks = results.landmarks[0];
      LANDMARK_INDEXES.forEach(index => {
        const lm = landmarks[index];
        if (!lm || lm.visibility < 0.75) return;

        const x = (1 - lm.x) * window.innerWidth;
        const y = lm.y * window.innerHeight;
        const prev = previousPoints.get(index);

        if (prev) {
          const speed = Math.hypot(x - prev.x, y - prev.y);
          // Soglia di movimento per evitare tremolii
          if (speed > 3) {
            const color = getColor(lm.x, lm.y);
            drawSinuousStroke(prev, {x, y}, color, speed);
          }
        }
        previousPoints.set(index, {x, y});
      });
    }
  }
  requestAnimationFrame(detect);
}

document.getElementById('resetBtn').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById('saveBtn').onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#000'; octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(canvas, 0,0);
  const link = document.createElement('a');
  link.download = 'entropia-liquid-v1-5-1.png';
  link.href = out.toDataURL(); link.click();
};

document.getElementById('startApp').onclick = async () => {
  document.getElementById('splash').style.display = 'none';
  await setupCamera();
  await setupPose();
  detect();
  // Memoria collettiva: reset ogni 5 minuti per permettere più stratificazione
  setInterval(() => ctx.clearRect(0,0,canvas.width,canvas.height), 300000);
};
</script>
</body>
</html>
