<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ENTROPIA CINETICA | Diego Capani</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #overlay {
            position: absolute; top: 20px; left: 20px; color: white;
            z-index: 10; font-family: 'Courier New', monospace; pointer-events: none;
        }
        #btn-start {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; z-index: 100; cursor: pointer; background: white; border: none;
        }
    </style>
</head>
<body>

    <div id="overlay">ENTROPIA CINETICA<br>Diego Capani - 2026</div>
    <button id="btn-start">ATTIVA INSTALLAZIONE</button>

    <a-scene id="scena" embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" style="display:none;">
        <a-marker preset="hiro">
            <!-- La superficie deve avere un materiale che p5 può aggiornare -->
            <a-plane id="tela" position="0 0 0" rotation="-90 0 0" width="3" height="3" 
                     material="shader: flat; transparent: true; opacity: 1;">
            </a-plane>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let video;
        let pg; // Il buffer persistente (la nostra tela digitale)
        let prevImg;
        const threshold = 30;

        document.getElementById('btn-start').addEventListener('click', function() {
            this.style.display = 'none';
            document.getElementById('scena').style.display = 'block';
            setupP5();
        });

        function setupP5() {
            new p5((p) => {
                p.setup = () => {
                    p.createCanvas(320, 240).hide();
                    video = p.createCapture(p.VIDEO);
                    video.size(320, 240);
                    video.hide();

                    // CREAZIONE TELA PERSISTENTE
                    pg = p.createGraphics(1024, 1024);
                    pg.clear(); // Inizia totalmente trasparente
                    
                    prevImg = p.createImage(320, 240);
                };

                p.draw = () => {
                    if (!video.loadedmetadata) return;

                    video.loadPixels();
                    prevImg.loadPixels();

                    // Logica di campionamento e traccia
                    let activePixels = 0;

                    for (let y = 0; y < video.height; y += 6) {
                        for (let x = 0; x < video.width; x += 6) {
                            let i = (x + y * video.width) * 4;
                            
                            let r1 = video.pixels[i];
                            let g1 = video.pixels[i+1];
                            let b1 = video.pixels[i+2];

                            let r2 = prevImg.pixels[i];
                            let g2 = prevImg.pixels[i+1];
                            let b2 = prevImg.pixels[i+2];

                            let diff = p.dist(r1, g1, b1, r2, g2, b2);

                            if (diff > threshold) {
                                // DISEGNO SULLA TELA PERSISTENTE (pg)
                                // Usiamo coordinate mappate per coprire la tela 1024x1024
                                let tx = p.map(x, 0, video.width, 0, pg.width);
                                let ty = p.map(y, 0, video.height, 0, pg.height);
                                
                                pg.noStroke();
                                pg.fill(r1, g1, b1, 150); // Colore reale campionato dagli abiti
                                pg.ellipse(tx, ty, diff * 0.8, diff * 0.8);
                                activePixels++;
                            }
                        }
                    }

                    if (activePixels > 0) {
                        prevImg.copy(video, 0, 0, 320, 240, 0, 0, 320, 240);
                        updateAR();
                    }
                };

                function updateAR() {
                    const plane = document.getElementById('tela');
                    if (plane && plane.getObject3D('mesh')) {
                        const mesh = plane.getObject3D('mesh');
                        const texture = new THREE.CanvasTexture(pg.elt);
                        
                        // IMPORTANTE: Disporre della vecchia texture per non saturare la GPU
                        if (mesh.material.map) mesh.material.map.dispose();
                        
                        mesh.material.map = texture;
                        mesh.material.needsUpdate = true;
                    }
                }
            });
        }
    </script>
</body>
</html>
