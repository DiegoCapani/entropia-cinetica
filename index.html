<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0.15;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

#ui {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  display: flex;
  gap: 8px;
}

button {
  background: rgba(0,0,0,0.55);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button onclick="resetCanvas()">Reset</button>
  <button onclick="saveImage()">Salva PNG</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Canvas interno a bassa risoluzione per il motion detection
const motionCanvas = document.createElement('canvas');
const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
motionCanvas.width = 160;
motionCanvas.height = 90;

let previousFrame = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: 'user',
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

function resetCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveImage() {
  const link = document.createElement('a');
  link.download = 'entropia-cinetica.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function drawBrushStroke(x, y, color, intensity) {
  const screenX = (1 - x / motionCanvas.width) * window.innerWidth;
  const screenY = (y / motionCanvas.height) * window.innerHeight;

  const length = 8 + intensity * 0.15;
  const angle = Math.random() * Math.PI * 2;

  const x2 = screenX + Math.cos(angle) * length;
  const y2 = screenY + Math.sin(angle) * length;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1 + intensity * 0.02;
  ctx.globalAlpha = 0.12;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(screenX, screenY);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.restore();
}

function processFrame() {
  if (video.readyState < 2) {
    requestAnimationFrame(processFrame);
    return;
  }

  // Copia il frame video nel canvas interno
  motionCtx.save();
  motionCtx.scale(-1, 1);
  motionCtx.drawImage(video, -motionCanvas.width, 0, motionCanvas.width, motionCanvas.height);
  motionCtx.restore();

  const frame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);
  const data = frame.data;

  if (previousFrame) {
    // Campiona solo alcuni pixel per mantenere alta fluidità
    for (let y = 0; y < motionCanvas.height; y += 4) {
      for (let x = 0; x < motionCanvas.width; x += 4) {
        const i = (y * motionCanvas.width + x) * 4;

        const dr = Math.abs(data[i] - previousFrame[i]);
        const dg = Math.abs(data[i + 1] - previousFrame[i + 1]);
        const db = Math.abs(data[i + 2] - previousFrame[i + 2]);

        const diff = dr + dg + db;

        // Disegna solo se c'è movimento significativo
        if (diff > 70) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const color = `rgba(${r}, ${g}, ${b}, 0.18)`;

          drawBrushStroke(x, y, color, diff);
        }
      }
    }
  }

  previousFrame = new Uint8ClampedArray(data);

  requestAnimationFrame(processFrame);
}

async function init() {
  await setupCamera();
  processFrame();
}

init().catch(err => {
  alert('Errore: ' + err.message);
  console.error(err);
});
</script>
</body>
</html>
