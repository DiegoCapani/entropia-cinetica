<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropia Cinetica</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#video {
  display: none;
}

#canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

#videoView {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0.18;
  filter: contrast(1.05) saturate(1.1);
  pointer-events: none;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
  display: flex;
  gap: 10px;
}

button {
  background: rgba(0,0,0,0.6);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: rgba(255,255,255,0.1);
}

/* SPLASH SCREEN */
#splash {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  color: white;
  background: #000;
  text-align: center;
}

#splash h1 {
  font-size: 42px;
  margin: 0;
  letter-spacing: 2px;
}

#splash p {
  margin-top: 10px;
  opacity: 0.7;
}

#startApp {
  margin-top: 25px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid white;
  background: transparent;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <h1>ENTROPIA CINETICA</h1>
  <p>web app v1.2</p>
  <button id="startApp">Avvia web app</button>
</div>

<video id="video" autoplay playsinline muted></video>
<video id="videoView" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <button id="resetBtn">Reset</button>
  <button id="saveBtn">Salva PNG</button>
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let poseLandmarker;
let previousPoints = new Map();
let lastStrokeTime = new Map();

const LANDMARK_INDEXES = [
  0, 11, 12,
  13, 14,
  15, 16,
  23, 24,
  25, 26,
  27, 28
];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user' },
    audio: false
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
    },
    runningMode: 'VIDEO',
    numPoses: 1
  });
}

/* 🎨 COLORI POTENZIATI (PIÙ VIVI + CONTRASTATI) */
const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

sampleCanvas.width = 80;
sampleCanvas.height = 80;

function getColorFromVideo(x, y) {
  if (!video.videoWidth || !video.videoHeight) {
    return 'rgba(255,255,255,0.25)';
  }

  const cx = (1 - x) * video.videoWidth;
  const cy = y * video.videoHeight;

  const size = 12;

  sampleCtx.drawImage(
    video,
    cx - size / 2,
    cy - size / 2,
    size,
    size,
    0,
    0,
    size,
    size
  );

  const data = sampleCtx.getImageData(0, 0, size, size).data;

  let r = 0, g = 0, b = 0;
  let count = 0;

  for (let i = 0; i < data.length; i += 4) {
    r += data[i];
    g += data[i + 1];
    b += data[i + 2];
    count++;
  }

  r /= count;
  g /= count;
  b /= count;

  // 🔥 BOOST saturazione
  r *= 1.18;
  g *= 1.12;
  b *= 1.22;

  // 🎯 contrasto locale (più separazione cromatica)
  const avg = (r + g + b) / 3;
  r += (r - avg) * 0.30;
  g += (g - avg) * 0.30;
  b += (b - avg) * 0.30;

  // clamp
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));

  return `rgba(${r|0}, ${g|0}, ${b|0}, 0.28)`;
}

function drawTrails(landmarks) {
  const now = performance.now();

  for (const index of LANDMARK_INDEXES) {
    const lm = landmarks[index];
    if (!lm || lm.visibility < 0.6) continue;

    const x = (1 - lm.x) * window.innerWidth;
    const y = lm.y * window.innerHeight;

    const prev = previousPoints.get(index);
    const color = getColorFromVideo(lm.x, lm.y);

    if (prev) {
      const dx = x - prev.x;
      const dy = y - prev.y;
      const speed = Math.hypot(dx, dy);

      if (speed < 8) {
        previousPoints.set(index, { x, y });
        continue;
      }

      const last = lastStrokeTime.get(index) || 0;
      if (now - last < 90) {
        previousPoints.set(index, { x, y });
        continue;
      }
      lastStrokeTime.set(index, now);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, Math.min(16, speed * 0.09));
      ctx.globalAlpha = 0.18;

      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);

      const cx = (prev.x + x) / 2 + (Math.random() - 0.5) * 8;
      const cy = (prev.y + y) / 2 + (Math.random() - 0.5) * 8;
      ctx.quadraticCurveTo(cx, cy, x, y);
      ctx.stroke();

      ctx.restore();
    }

    previousPoints.set(index, { x, y });
  }
}

function render() {
  if (video.readyState >= 2) {
    sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  }
  requestAnimationFrame(render);
}

async function detectLoop() {
  const results = poseLandmarker.detectForVideo(video, performance.now());

  if (results.landmarks && results.landmarks.length > 0) {
    drawTrails(results.landmarks[0]);
  }

  requestAnimationFrame(detectLoop);
}

function resetCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  previousPoints.clear();
}

function saveCanvas() {
  const link = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.download = `entropia-cinetica-${timestamp}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function goFullscreen() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen().catch(() => {});
  }
}

/* UI */
document.getElementById('resetBtn').addEventListener('click', resetCanvas);
document.getElementById('saveBtn').addEventListener('click', saveCanvas);
document.getElementById('fullscreenBtn').addEventListener('click', goFullscreen);

/* START */
document.getElementById('startApp').addEventListener('click', async () => {
  document.getElementById('splash').style.display = 'none';

  resetCanvas();
  await setupCamera();
  await setupPose();

  render();
  detectLoop();

  setInterval(resetCanvas, 180000);
});
</script>

</body>
</html>
